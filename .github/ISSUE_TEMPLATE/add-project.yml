name: "✨ Submit a Project / 提交新项目"
description: "Just paste the GitHub repo URL — AI will auto-fill metadata, check compliance, and open a PR. / 只需贴上 GitHub 仓库地址，AI 会自动补全信息、初审合规并提 PR。"
title: "[Add] "
labels: ["add-project"]
body:
  - type: markdown
    attributes:
      value: |
        只需要填写 **GitHub 仓库链接** 并勾选合规确认！提交后，AI 自动化工作流会读取仓库 README 自动提取中英双语简介、分类、平台、标签与项目 Logo，初审通过后自动生成收录 PR 等待维护者合并。

        Just paste the **GitHub repository URL** and confirm the checklist below! Our automated AI workflow will inspect the README, generate bilingual metadata & logo, run compliance checks, and open a PR for maintainer review.

        > 💡 熟悉 Git & Bun 的开发者也可按 [CONTRIBUTING.md](https://github.com/zzstar101/awesome-nte/blob/main/CONTRIBUTING.md) 直接提 PR。

  - type: input
    id: repository
    attributes:
      label: "GitHub 仓库链接 / GitHub Repository URL"
      description: "必须是公开可读源码的开源仓库 / Must be a public open-source GitHub repository."
      placeholder: "https://github.com/owner/repo"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: "补充说明（可选）/ Extra Notes (optional)"
      description: "留空即可由 AI 自动生成；如有特定分类偏好、功能亮点或与现有项目的差异化，可顺手写在这里 / Leave blank for AI auto-fill, or add differentiation notes."
      placeholder: "可选：例如支持跨平台 / 重点功能 / 推荐分类..."
    validations:
      required: false

  - type: input
    id: website
    attributes:
      label: "官网或在线文档链接（可选）/ Website or Docs URL (optional)"
      description: "若仓库主页已填写可留空 / Leave blank if already set on GitHub repo homepage."
      placeholder: "https://example.com"
    validations:
      required: false

  - type: input
    id: logo
    attributes:
      label: "项目 Logo 链接（可选）/ Project Logo URL (optional)"
      description: "留空会自动扫描仓库内方图图标或使用作者头像 / Leave blank for automatic logo detection."
      placeholder: "https://raw.githubusercontent.com/owner/repo/main/assets/logo.png"
    validations:
      required: false

  - type: checkboxes
    id: criteria
    attributes:
      label: "收录标准确认 / Inclusion Criteria Checklist"
      options:
        - label: "开源透明：公开可读源码，非纯二进制闭源分发 / Open source with public readable code"
          required: true
        - label: "直接相关：面向《异环》(NTE)，或明确声明支持 NTE / Built for NTE or explicitly supports NTE"
          required: true
        - label: "清晰可用：有说明用途与用法的 README，非空壳占位 / Has a clear README and is usable"
          required: true
        - label: "合规零注入：不修改游戏进程、内存或网络，无外挂与私服 / Zero memory/process injection & not a private server"
          required: true
