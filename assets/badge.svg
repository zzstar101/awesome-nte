<svg xmlns="http://www.w3.org/2000/svg" width="160" height="30" viewBox="0 0 160 30" role="img" aria-label="Awesome NTE">
  <title>Awesome NTE</title>
  <defs>
    <pattern id="nte-badge-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.95" fill="#FFFFFF" opacity="0.5"/>
      <circle cx="4.5" cy="4.5" r="0.95" fill="#FFFFFF" opacity="0.5"/>
    </pattern>
    <clipPath id="nte-badge-clip">
      <rect x="1.5" y="1.5" width="155" height="25" rx="6.5"/>
    </clipPath>
    <mask id="nte-badge-slice">
      <rect x="-2" y="-2" width="38" height="16" fill="#FFFFFF"/>
      <line x1="-1.5" y1="11.1" x2="11.5" y2="5.9" stroke="#000000" stroke-width="0.82"/>
      <line x1="13.5" y1="11.4" x2="21.0" y2="8.4" stroke="#000000" stroke-width="0.82"/>
      <line x1="25.5" y1="11.8" x2="34.5" y2="8.2" stroke="#000000" stroke-width="0.82"/>
    </mask>
  </defs>

  <!-- Pop sticker drop shadow -->
  <rect x="3.5" y="3.5" width="155" height="25" rx="6.5" fill="#171824"/>

  <g clip-path="url(#nte-badge-clip)">
    <!-- Left pop-yellow panel with halftone dots -->
    <rect x="1.5" y="1.5" width="99" height="25" fill="#FFD92E"/>
    <rect x="1.5" y="1.5" width="99" height="25" fill="url(#nte-badge-dots)"/>

    <!-- Right mint-cyan panel with subtle sheen -->
    <polygon points="100,1.5 156.5,1.5 156.5,26.5 93,26.5" fill="#17E2CE"/>
    <polygon points="110,1.5 120,1.5 113,26.5 103,26.5" fill="#FFFFFF" opacity="0.22"/>

    <!-- Hot-pink diagonal racing stripe -->
    <polygon points="95.5,1.5 100.5,1.5 93.5,26.5 88.5,26.5" fill="#FF2E7E"/>
    <line x1="95.5" y1="1.5" x2="88.5" y2="26.5" stroke="#171824" stroke-width="1.6"/>
    <line x1="100.5" y1="1.5" x2="93.5" y2="26.5" stroke="#171824" stroke-width="1.6"/>
  </g>

  <!-- Crisp dark ink sticker outline -->
  <rect x="1.5" y="1.5" width="155" height="25" rx="6.5" fill="none" stroke="#171824" stroke-width="1.8"/>

  <!-- Mint's iconic ghost-cat silhouette -->
  <g transform="translate(7.5, 4.4) scale(0.8125)">
    <path d="M 4.1 12.0 C 3.5 8.8 4.6 5.5 6.5 3.3 C 7.1 2.6 8.1 2.9 8.6 4.1 L 9.7 6.7 C 11.2 6.3 12.8 6.3 14.3 6.7 L 15.4 4.1 C 15.9 2.9 16.9 2.6 17.5 3.3 C 19.4 5.5 20.5 8.8 19.9 12.0 C 20.9 13.3 20.8 15.2 19.7 16.4 C 18.6 17.6 17.1 17.6 16.2 17.1 C 14.9 18.2 13.5 18.7 12.0 18.7 C 10.5 18.7 9.1 18.2 7.8 17.1 C 6.9 17.6 5.4 17.6 4.3 16.4 C 3.2 15.2 3.1 13.3 4.1 12.0 Z" fill="#171824"/>
    <circle cx="8.6" cy="11.2" r="2.25" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
    <circle cx="15.4" cy="11.2" r="2.25" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
    <path d="M 10.4 15.1 L 12.0 12.8 L 13.6 15.1 Z" fill="#FF477E"/>
    <path d="M 11.4 13.6 L 12.0 14.5 L 12.6 13.6 Z" fill="#FFFFFF"/>
  </g>

  <!-- AWESOME label -->
  <text x="60" y="17.5" fill="#171824" font-family="Verdana, Geneva, DejaVu Sans, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.45" text-anchor="middle" text-rendering="geometricPrecision">AWESOME</text>

  <!-- Custom slash-cut NTE wordmark -->
  <g transform="translate(103.5, 8.6) scale(0.98)">
    <g mask="url(#nte-badge-slice)" fill="#171824">
      <path d="M 0.8 0 L 3.3 0 L 7.4 6.5 L 7.4 0 L 9.9 0 L 9.9 11.2 L 7.5 11.2 L 3.4 4.7 L 3.4 11.2 L 0.8 11.2 Z"/>
      <path d="M 11.5 0.9 C 11.5 0.3 11.9 0 12.5 0 L 20.5 0 C 21.1 0 21.5 0.3 21.5 0.9 L 21.5 2.9 L 20.6 2.9 C 20.4 2.4 20.0 2.2 19.3 2.2 L 17.8 2.2 L 17.8 11.2 L 15.2 11.2 L 15.2 2.2 L 13.7 2.2 C 13.0 2.2 12.6 2.4 12.4 2.9 L 11.5 2.9 Z"/>
      <path d="M 23.8 0 L 32.0 0 C 32.3 0 32.5 0.2 32.5 0.5 L 32.5 2.2 L 26.2 2.2 C 25.7 2.2 25.5 2.4 25.5 2.9 L 25.5 4.4 L 31.6 4.4 L 30.9 6.6 L 25.5 6.6 L 25.5 8.9 L 32.5 8.9 L 32.5 11.2 L 23.0 11.2 L 23.0 0.8 C 23.0 0.3 23.3 0 23.8 0 Z"/>
    </g>
  </g>

  <!-- Mint's tilted cross-sparkle -->
  <path d="M 0 -4.3 L 1.204 -1.204 L 4.3 0 L 1.204 1.204 L 0 4.3 L -1.204 1.204 L -4.3 0 L -1.204 -1.204 Z" fill="#FF2E7E" transform="translate(145.5, 9.8) rotate(16)"/>
  <path d="M 0 -1.9 L 0.532 -0.532 L 1.9 0 L 0.532 0.532 L 0 1.9 L -0.532 0.532 L -1.9 0 L -0.532 -0.532 Z" fill="#FFFFFF" transform="translate(145.5, 9.8) rotate(16)"/>
</svg>
