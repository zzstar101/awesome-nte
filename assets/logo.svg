<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Awesome NTE Logo">
  <title>Awesome NTE</title>
  <defs>
    <pattern id="nte-logo-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.8" fill="#FFFFFF" opacity="0.48"/>
      <circle cx="9" cy="9" r="1.8" fill="#FFFFFF" opacity="0.48"/>
    </pattern>
    <clipPath id="nte-logo-clip">
      <rect x="6" y="6" width="108" height="108" rx="26"/>
    </clipPath>
  </defs>

  <!-- Pop sticker hard drop shadow -->
  <rect x="13" y="13" width="108" height="108" rx="26" fill="#171824"/>

  <g clip-path="url(#nte-logo-clip)">
    <!-- Pop-yellow sticker canvas with halftone dots -->
    <rect x="6" y="6" width="108" height="108" fill="#FFD92E"/>
    <rect x="6" y="6" width="108" height="108" fill="url(#nte-logo-dots)"/>

    <!-- Bottom-right mint-cyan corner slash -->
    <polygon points="114,82 114,114 74,114" fill="#17E2CE"/>
    <polygon points="114,94 114,104 94,114 84,114" fill="#FFFFFF" opacity="0.28"/>

    <!-- Hot-pink diagonal racing stripe -->
    <polygon points="114,72 114,82 74,114 61,114" fill="#FF2E7E"/>
    <line x1="114" y1="72" x2="61" y2="114" stroke="#171824" stroke-width="3.2"/>
    <line x1="114" y1="82" x2="74" y2="114" stroke="#171824" stroke-width="3.2"/>
  </g>

  <!-- Crisp dark ink sticker outline -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="none" stroke="#171824" stroke-width="5"/>

  <!-- Mint's iconic ghost-cat emblem -->
  <g transform="translate(8.4, 12.2) scale(4.25)">
    <path d="M 4.1 12.0 C 3.5 8.8 4.6 5.5 6.5 3.3 C 7.1 2.6 8.1 2.9 8.6 4.1 L 9.7 6.7 C 11.2 6.3 12.8 6.3 14.3 6.7 L 15.4 4.1 C 15.9 2.9 16.9 2.6 17.5 3.3 C 19.4 5.5 20.5 8.8 19.9 12.0 C 20.9 13.3 20.8 15.2 19.7 16.4 C 18.6 17.6 17.1 17.6 16.2 17.1 C 14.9 18.2 13.5 18.7 12.0 18.7 C 10.5 18.7 9.1 18.2 7.8 17.1 C 6.9 17.6 5.4 17.6 4.3 16.4 C 3.2 15.2 3.1 13.3 4.1 12.0 Z" fill="#171824"/>
    <circle cx="8.6" cy="11.2" r="2.25" fill="none" stroke="#FFFFFF" stroke-width="1.45"/>
    <circle cx="15.4" cy="11.2" r="2.25" fill="none" stroke="#FFFFFF" stroke-width="1.45"/>
    <path d="M 10.4 15.1 L 12.0 12.8 L 13.6 15.1 Z" fill="#FF2E7E"/>
    <path d="M 11.4 13.6 L 12.0 14.5 L 12.6 13.6 Z" fill="#FFFFFF"/>
  </g>

  <!-- Mint's tilted 4-point cross-sparkle -->
  <g transform="translate(96.5, 25.5) rotate(16)">
    <path d="M 0 -10.5 L 2.9 -2.9 L 10.5 0 L 2.9 2.9 L 0 10.5 L -2.9 2.9 L -10.5 0 L -2.9 -2.9 Z" fill="#FF2E7E"/>
    <path d="M 0 -4.8 L 1.35 -1.35 L 4.8 0 L 1.35 1.35 L 0 4.8 L -1.35 1.35 L -4.8 0 L -1.35 -1.35 Z" fill="#FFFFFF"/>
  </g>
</svg>
